<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctors</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-6">Verified Doctors</h1>

<table class="w-full bg-white rounded shadow">
  <thead>
    <tr class="bg-gray-200">
      <th class="p-2">Name</th>
      <th class="p-2">Email</th>
      <th class="p-2">Phone</th>
    </tr>
  </thead>
  <tbody id="doctorTable"></tbody>
</table>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient('YOUR_URL','YOUR_ANON_KEY');

async function loadDoctors() {
  const { data } = await supabase
    .from('user_profiles')
    .select('*')
    .eq('role', 'doctor')
    .eq('verified', true);

  const tbody = document.getElementById('doctorTable');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="3">No doctors</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(d => `
    <tr>
      <td>Dr. ${d.first_name} ${d.last_name}</td>
      <td>${d.email}</td>
      <td>${d.phone || ''}</td>
    </tr>
  `).join('');
}

loadDoctors();
</script>

</body>
</html>
