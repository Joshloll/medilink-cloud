<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confirm Doctors</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-6">Doctor Approval</h1>

<div id="doctorList" class="space-y-3"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient(
  'https://zczlhrsmlecannuqknju.supabase.co',
  'YOUR_ANON_KEY'
);

// LOAD DOCTORS
async function loadDoctors() {
  const container = document.getElementById('doctorList');

  const { data, error } = await supabase
    .from('user_profiles')
    .select('*')
    .eq('role', 'doctor')
    .eq('verified', false);

  if (error) {
    container.innerHTML = "Error loading doctors";
    return;
  }

  if (!data.length) {
    container.innerHTML = "No pending doctors";
    return;
  }

  container.innerHTML = data.map(doc => `
    <div class="p-4 bg-white rounded shadow flex justify-between items-center">
      <div>
        <p class="font-bold">Dr. ${doc.first_name} ${doc.last_name}</p>
        <p class="text-sm">${doc.email}</p>
      </div>
      <div class="flex gap-2">
        <button onclick="approveDoctor('${doc.id}')" class="bg-green-500 text-white px-3 py-1 rounded">Approve</button>
        <button onclick="rejectDoctor('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded">Reject</button>
      </div>
    </div>
  `).join('');
}

window.approveDoctor = async (id) => {
  await supabase.from('user_profiles').update({ verified: true }).eq('id', id);
  loadDoctors();
};

window.rejectDoctor = async (id) => {
  await supabase.from('user_profiles').update({ is_active: false }).eq('id', id);
  loadDoctors();
};

loadDoctors();
</script>

</body>
</html>
