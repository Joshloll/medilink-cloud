<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Prescriptions - MediLink Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#137fec",
                "primary-dark": "#0b63be",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
                "card-light": "#ffffff",
                "card-dark": "#1e2936",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
            },
          },
        }
    </script>
    <style>
        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155; 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        
        /* Loading animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Hover effects */
        .prescription-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-200 antialiased">
    <!-- Header -->
    <header class="bg-white dark:bg-card-dark border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo and Back -->
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">arrow_back</span>
                        <span class="font-medium">Back to Dashboard</span>
                    </a>
                    <div class="flex items-center gap-3">
                        <div class="size-8 bg-primary/10 flex items-center justify-center rounded-lg">
                            <span class="material-symbols-outlined text-primary">medication</span>
                        </div>
                        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Prescriptions</h1>
                    </div>
                </div>
                
                <!-- User Info -->
                <div class="flex items-center gap-3">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-slate-900 dark:text-white">Sarah Jenkins</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Patient ID: #88392</p>
                    </div>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 ring-2 ring-white dark:ring-slate-700 shadow-sm" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC7EVV5ypCihmYTSLn_G46OXG5ANaHMBRiwg5jjL07ySsqqpdonXwP9X7D_EVXqAHezuQLakGuBna0qhRsYHEQNBytapacC0kHXKbVQUBxmnrpM0Ok_Nald063RJcdBmpjc68W1Uypp8PA73IlgaetT7ApK9eDjULbNuc1FwR1RwGOJpCSpccRMIOqJpQUK_yrHkmaBb7MIUhHs-3opqyWFHnBN-X7Nu1TdjcOO2AXQVjf2WKonS1prMOvWbNOa46WJxFhJ9MzXA8Vq");'></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen bg-background-light dark:bg-background-dark">
        <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Active Prescriptions</p>
                            <p class="text-2xl font-bold text-slate-900 dark:text-white">5</p>
                        </div>
                        <div class="size-12 bg-green-100 dark:bg-green-900/20 rounded-lg flex items-center justify-center">
                            <span class="material-symbols-outlined text-green-600 dark:text-green-400">medication</span>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Refills Needed</p>
                            <p class="text-2xl font-bold text-slate-900 dark:text-white">2</p>
                        </div>
                        <div class="size-12 bg-amber-100 dark:bg-amber-900/20 rounded-lg flex items-center justify-center">
                            <span class="material-symbols-outlined text-amber-600 dark:text-amber-400">pending</span>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Expired</p>
                            <p class="text-2xl font-bold text-slate-900 dark:text-white">1</p>
                        </div>
                        <div class="size-12 bg-red-100 dark:bg-red-900/20 rounded-lg flex items-center justify-center">
                            <span class="material-symbols-outlined text-red-600 dark:text-red-400">error</span>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Monthly Cost</p>
                            <p class="text-2xl font-bold text-slate-900 dark:text-white">$85</p>
                        </div>
                        <div class="size-12 bg-blue-100 dark:bg-blue-900/20 rounded-lg flex items-center justify-center">
                            <span class="material-symbols-outlined text-blue-600 dark:text-blue-400">attach_money</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters and Actions -->
            <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 mb-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                        <input type="text" id="searchInput" placeholder="Search prescriptions by medication name or doctor..." class="w-full pl-10 pr-4 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary">
                    </div>
                    <div class="flex gap-2">
                        <select id="statusFilter" class="px-4 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="expired">Expired</option>
                            <option value="refill-needed">Refill Needed</option>
                        </select>
                        <button id="requestRefillBtn" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors flex items-center gap-2">
                            <span class="material-symbols-outlined">add</span>
                            Request Refill
                        </button>
                    </div>
                </div>
            </div>

            <!-- Prescriptions List -->
            <div id="prescriptionsContainer" class="space-y-4">
                <!-- Prescriptions will be populated here -->
                <div class="text-center py-12">
                    <div class="animate-spin size-8 mx-auto mb-4 text-primary">
                        <span class="material-symbols-outlined">refresh</span>
                    </div>
                    <p class="text-slate-500 dark:text-slate-400">Loading prescriptions...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Prescription Detail Modal -->
    <div id="prescriptionModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2">
            <div class="bg-white dark:bg-card-dark rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden transform transition-all">
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-slate-800">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">Prescription Details</h3>
                    <button onclick="closeModal()" class="size-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition-colors">
                        <span class="material-symbols-outlined text-slate-500">close</span>
                    </button>
                </div>
                
                <!-- Modal Content -->
                <div id="modalContent" class="p-6 overflow-y-auto max-h-[60vh]">
                    <!-- Content will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Refill Request Modal -->
    <div id="refillModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="closeRefillModal()"></div>
        <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2">
            <div class="bg-white dark:bg-card-dark rounded-2xl shadow-2xl w-full max-w-md p-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-4">Request Prescription Refill</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Select Medication</label>
                        <select id="medicationSelect" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white">
                            <option value="">Choose a medication...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Pharmacy</label>
                        <select class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white">
                            <option>Main Street Pharmacy</option>
                            <option>CVS Health</option>
                            <option>Walgreens</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Reason for Refill</label>
                        <textarea class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white" rows="3" placeholder="Please specify reason..."></textarea>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="closeRefillModal()" class="flex-1 px-4 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700">
                            Cancel
                        </button>
                        <button onclick="submitRefill()" class="flex-1 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark">
                            Submit Request
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Prescription functionality
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Prescriptions page loaded');
            
            // Mock prescriptions data
            const prescriptions = [
                {
                    id: 1,
                    medication: 'Lisinopril',
                    dosage: '10mg',
                    frequency: 'Once daily',
                    prescribedBy: 'Dr. Emily Chen',
                    startDate: '2023-08-01',
                    endDate: '2024-02-01',
                    refills: 2,
                    status: 'active',
                    pharmacy: 'Main Street Pharmacy',
                    cost: 25,
                    instructions: 'Take with water, may cause dizziness'
                },
                {
                    id: 2,
                    medication: 'Metformin',
                    dosage: '500mg',
                    frequency: 'Twice daily',
                    prescribedBy: 'Dr. Sarah Miller',
                    startDate: '2023-07-15',
                    endDate: '2024-01-15',
                    refills: 1,
                    status: 'refill-needed',
                    pharmacy: 'CVS Health',
                    cost: 35,
                    instructions: 'Take with meals to reduce stomach upset'
                },
                {
                    id: 3,
                    medication: 'Atorvastatin',
                    dosage: '20mg',
                    frequency: 'Once daily',
                    prescribedBy: 'Dr. Robert Fox',
                    startDate: '2023-06-01',
                    endDate: '2023-12-01',
                    refills: 0,
                    status: 'expired',
                    pharmacy: 'Walgreens',
                    cost: 45,
                    instructions: 'Take in the evening, avoid grapefruit'
                },
                {
                    id: 4,
                    medication: 'Amlodipine',
                    dosage: '5mg',
                    frequency: 'Once daily',
                    prescribedBy: 'Dr. Emily Chen',
                    startDate: '2023-09-01',
                    endDate: '2024-03-01',
                    refills: 3,
                    status: 'active',
                    pharmacy: 'Main Street Pharmacy',
                    cost: 30,
                    instructions: 'Take at same time each day'
                },
                {
                    id: 5,
                    medication: 'Omeprazole',
                    dosage: '20mg',
                    frequency: 'Once daily',
                    prescribedBy: 'Dr. Lisa Wang',
                    startDate: '2023-08-15',
                    endDate: '2024-02-15',
                    refills: 2,
                    status: 'active',
                    pharmacy: 'CVS Health',
                    cost: 20,
                    instructions: 'Take 30 minutes before breakfast'
                }
            ];
            
            // Render prescriptions
            function renderPrescriptions() {
                const container = document.getElementById('prescriptionsContainer');
                container.innerHTML = prescriptions.map(prescription => `
                    <div class="prescription-card bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 hover:shadow-md transition-all cursor-pointer" onclick="viewPrescription(${prescription.id})">
                        <div class="flex items-start justify-between">
                            <div class="flex items-start gap-4">
                                <div class="size-12 rounded-lg ${getStatusColor(prescription.status)} flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined text-xl">medication</span>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-2">
                                        <h3 class="text-lg font-semibold text-slate-900 dark:text-white">${prescription.medication}</h3>
                                        <span class="px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(prescription.status)}">
                                            ${prescription.status.replace('-', ' ').charAt(0).toUpperCase() + prescription.status.replace('-', ' ').slice(1)}
                                        </span>
                                        ${prescription.refills > 0 ? `
                                            <span class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 dark:bg-blue-900/20 text-blue-700 dark:text-blue-400">
                                                ${prescription.refills} refills
                                            </span>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400 mb-2">
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">medication_liquid</span>
                                            <span>${prescription.dosage}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">schedule</span>
                                            <span>${prescription.frequency}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">person</span>
                                            <span>${prescription.prescribedBy}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">calendar_today</span>
                                            <span>${formatDate(prescription.startDate)} - ${formatDate(prescription.endDate)}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">pharmacy</span>
                                            <span>${prescription.pharmacy}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">attach_money</span>
                                            <span>$${prescription.cost}/month</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${prescription.status === 'active' && prescription.refills > 0 ? `
                                    <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" onclick="event.stopPropagation(); requestRefill(${prescription.id})">
                                        <span class="material-symbols-outlined text-slate-500">refresh</span>
                                    </button>
                                ` : ''}
                                <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                    <span class="material-symbols-outlined text-slate-500">arrow_forward</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            function getStatusColor(status) {
                const colors = {
                    active: 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
                    expired: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
                    'refill-needed': 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'
                };
                return colors[status] || 'bg-slate-100 text-slate-700';
            }
            
            function formatDate(dateStr) {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            
            // View prescription details
            window.viewPrescription = function(prescriptionId) {
                const prescription = prescriptions.find(p => p.id === prescriptionId);
                if (!prescription) return;
                
                const modal = document.getElementById('prescriptionModal');
                const modalContent = document.getElementById('modalContent');
                
                modalContent.innerHTML = `
                    <div class="space-y-6">
                        <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${prescription.medication} ${prescription.dosage}</h2>
                            <div class="flex items-center gap-4 mt-2 text-sm text-slate-500 dark:text-slate-400">
                                <span class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">person</span>
                                    ${prescription.prescribedBy}
                                </span>
                                <span class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">calendar_today</span>
                                    ${formatDate(prescription.startDate)}
                                </span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Prescription Information</h3>
                                <div class="space-y-3">
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Status</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${prescription.status.replace('-', ' ').charAt(0).toUpperCase() + prescription.status.replace('-', ' ').slice(1)}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Dosage</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${prescription.dosage}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Frequency</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${prescription.frequency}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Refills Remaining</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${prescription.refills}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div>
                                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Pharmacy Information</h3>
                                <div class="space-y-3">
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Pharmacy</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${prescription.pharmacy}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Monthly Cost</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">$${prescription.cost}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                        <span class="text-sm text-slate-500 dark:text-slate-400">Valid Until</span>
                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${formatDate(prescription.endDate)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Instructions</h3>
                            <div class="bg-slate-50 dark:bg-slate-800 rounded-lg p-4">
                                <p class="text-sm text-slate-700 dark:text-slate-300">${prescription.instructions}</p>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            ${prescription.status === 'active' && prescription.refills > 0 ? `
                                <button onclick="requestRefill(${prescription.id})" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors">
                                    Request Refill
                                </button>
                            ` : ''}
                            <button class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                                Download PDF
                            </button>
                        </div>
                    </div>
                `;
                
                modal.classList.remove('hidden');
            };
            
            // Request refill
            window.requestRefill = function(prescriptionId) {
                const prescription = prescriptions.find(p => p.id === prescriptionId);
                if (!prescription) return;
                
                const modal = document.getElementById('refillModal');
                const medicationSelect = document.getElementById('medicationSelect');
                
                // Populate medication dropdown
                const activePrescriptions = prescriptions.filter(p => p.status === 'active' && p.refills > 0);
                medicationSelect.innerHTML = '<option value="">Choose a medication...</option>' + 
                    activePrescriptions.map(p => `<option value="${p.id}" ${p.id === prescriptionId ? 'selected' : ''}>${p.medication} ${p.dosage}</option>`).join('');
                
                modal.classList.remove('hidden');
            };
            
            // Submit refill
            window.submitRefill = function() {
                const medicationSelect = document.getElementById('medicationSelect');
                if (!medicationSelect.value) {
                    alert('Please select a medication');
                    return;
                }
                
                alert('Refill request submitted successfully! You will be notified when it\'s ready.');
                closeRefillModal();
            };
            
            // Close modals
            window.closeModal = function() {
                const modal = document.getElementById('prescriptionModal');
                modal.classList.add('hidden');
            };
            
            window.closeRefillModal = function() {
                const modal = document.getElementById('refillModal');
                modal.classList.add('hidden');
            };
            
            // Filter functionality
            document.getElementById('searchInput').addEventListener('input', filterPrescriptions);
            document.getElementById('statusFilter').addEventListener('change', filterPrescriptions);
            
            function filterPrescriptions() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const statusFilter = document.getElementById('statusFilter').value;
                
                const filtered = prescriptions.filter(prescription => {
                    const matchesSearch = !searchTerm || 
                        prescription.medication.toLowerCase().includes(searchTerm) ||
                        prescription.prescribedBy.toLowerCase().includes(searchTerm);
                    
                    const matchesStatus = !statusFilter || prescription.status === statusFilter;
                    
                    return matchesSearch && matchesStatus;
                });
                
                // Re-render with filtered results
                const container = document.getElementById('prescriptionsContainer');
                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <span class="material-symbols-outlined text-6xl text-slate-300 dark:text-slate-600">medication</span>
                            <p class="text-slate-500 dark:text-slate-400 mt-4">No prescriptions found</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = filtered.map(prescription => `
                        <div class="prescription-card bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 hover:shadow-md transition-all cursor-pointer" onclick="viewPrescription(${prescription.id})">
                            <div class="flex items-start justify-between">
                                <div class="flex items-start gap-4">
                                    <div class="size-12 rounded-lg ${getStatusColor(prescription.status)} flex items-center justify-center shrink-0">
                                        <span class="material-symbols-outlined text-xl">medication</span>
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-2">
                                            <h3 class="text-lg font-semibold text-slate-900 dark:text-white">${prescription.medication}</h3>
                                            <span class="px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(prescription.status)}">
                                                ${prescription.status.replace('-', ' ').charAt(0).toUpperCase() + prescription.status.replace('-', ' ').slice(1)}
                                            </span>
                                            ${prescription.refills > 0 ? `
                                                <span class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 dark:bg-blue-900/20 text-blue-700 dark:text-blue-400">
                                                    ${prescription.refills} refills
                                                </span>
                                            ` : ''}
                                        </div>
                                        <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400 mb-2">
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">medication_liquid</span>
                                                <span>${prescription.dosage}</span>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">schedule</span>
                                                <span>${prescription.frequency}</span>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">person</span>
                                                <span>${prescription.prescribedBy}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">calendar_today</span>
                                                <span>${formatDate(prescription.startDate)} - ${formatDate(prescription.endDate)}</span>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">pharmacy</span>
                                                <span>${prescription.pharmacy}</span>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">attach_money</span>
                                                <span>$${prescription.cost}/month</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    ${prescription.status === 'active' && prescription.refills > 0 ? `
                                        <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" onclick="event.stopPropagation(); requestRefill(${prescription.id})">
                                            <span class="material-symbols-outlined text-slate-500">refresh</span>
                                        </button>
                                    ` : ''}
                                    <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                        <span class="material-symbols-outlined text-slate-500">arrow_forward</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            }
            
            // Request refill button
            document.getElementById('requestRefillBtn').addEventListener('click', function() {
                requestRefill();
            });
            
            // Initial render
            renderPrescriptions();
        });
    </script>
</body>
</html>
