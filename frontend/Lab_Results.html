<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Lab Results - MediLink Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#137fec",
                "primary-dark": "#0b63be",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
                "card-light": "#ffffff",
                "card-dark": "#1e2936",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
            },
          },
        }
    </script>
    <style>
        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155; 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        
        /* Loading animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Hover effects */
        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-200 antialiased">
    <!-- Header -->
    <header class="bg-white dark:bg-card-dark border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo and Back -->
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">arrow_back</span>
                        <span class="font-medium">Back to Dashboard</span>
                    </a>
                    <div class="flex items-center gap-3">
                        <div class="size-8 bg-primary/10 flex items-center justify-center rounded-lg">
                            <span class="material-symbols-outlined text-primary">science</span>
                        </div>
                        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Lab Results</h1>
                    </div>
                </div>
                
                <!-- User Info -->
                <div class="flex items-center gap-3">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-slate-900 dark:text-white">Sarah Jenkins</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Patient ID: #88392</p>
                    </div>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 ring-2 ring-white dark:ring-slate-700 shadow-sm" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC7EVV5ypCihmYTSLn_G46OXG5ANaHMBRiwg5jjL07ySsqqpdonXwP9X7D_EVXqAHezuQLakGuBna0qhRsYHEQNBytapacC0kHXKbVQUBxmnrpM0Ok_Nald063RJcdBmpjc68W1Uypp8PA73IlgaetT7ApK9eDjULbNuc1FwR1RwGOJpCSpccRMIOqJpQUK_yrHkmaBb7MIUhHs-3opqyWFHnBN-X7Nu1TdjcOO2AXQVjf2WKonS1prMOvWbNOa46WJxFhJ9MzXA8Vq");'></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen bg-background-light dark:bg-background-dark">
        <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
            <!-- Filters and Search -->
            <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 mb-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                        <input type="text" id="searchInput" placeholder="Search lab results by test type or date..." class="w-full pl-10 pr-4 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary">
                    </div>
                    <div class="flex gap-2">
                        <select id="typeFilter" class="px-4 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary">
                            <option value="">All Types</option>
                            <option value="blood">Blood Test</option>
                            <option value="imaging">Imaging</option>
                            <option value="urine">Urine Test</option>
                            <option value="pathology">Pathology</option>
                        </select>
                        <select id="statusFilter" class="px-4 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary">
                            <option value="">All Status</option>
                            <option value="completed">Completed</option>
                            <option value="pending">Pending</option>
                            <option value="review">Under Review</option>
                        </select>
                        <button id="refreshBtn" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                            <span class="material-symbols-outlined">refresh</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results List -->
            <div id="resultsContainer" class="space-y-4">
                <!-- Results will be populated here -->
                <div class="text-center py-12">
                    <div class="animate-spin size-8 mx-auto mb-4 text-primary">
                        <span class="material-symbols-outlined">refresh</span>
                    </div>
                    <p class="text-slate-500 dark:text-slate-400">Loading lab results...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Result Detail Modal -->
    <div id="resultModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2">
            <div class="bg-white dark:bg-card-dark rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden transform transition-all">
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-slate-800">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">Lab Result Details</h3>
                    <button onclick="closeModal()" class="size-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition-colors">
                        <span class="material-symbols-outlined text-slate-500">close</span>
                    </button>
                </div>
                
                <!-- Modal Content -->
                <div id="modalContent" class="p-6 overflow-y-auto max-h-[60vh]">
                    <!-- Content will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lab Results functionality
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Lab Results page loaded');
            
            // Mock data
            const results = [
                {
                    id: 1,
                    type: 'blood',
                    date: 'Sep 25, 2023',
                    orderedBy: 'Dr. Sarah Miller',
                    status: 'pending',
                    tests: ['CBC', 'CMP', 'Lipid Panel'],
                    results: null
                },
                {
                    id: 2,
                    type: 'imaging',
                    date: 'Aug 15, 2023',
                    orderedBy: 'Dr. Robert Fox',
                    status: 'completed',
                    tests: ['Chest X-Ray'],
                    results: {
                        impression: 'No acute cardiopulmonary abnormality',
                        findings: 'Lungs clear, heart size normal'
                    },
                    detailedResults: {
                        'Chest X-Ray': {
                            'Heart Size': 'Normal',
                            'Lungs': 'Clear',
                            'Bones': 'No acute abnormalities'
                        }
                    }
                }
            ];
            
            // Render results
            function renderResults() {
                const container = document.getElementById('resultsContainer');
                container.innerHTML = results.map(result => `
                    <div class="result-card bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 hover:shadow-md transition-all cursor-pointer" onclick="viewResult(${result.id})">
                        <div class="flex items-start justify-between">
                            <div class="flex items-start gap-4">
                                <div class="size-12 rounded-lg ${getTypeColor(result.type)} flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined text-xl">${getTypeIcon(result.type)}</span>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-2">
                                        <h3 class="text-lg font-semibold text-slate-900 dark:text-white">${result.type.charAt(0).toUpperCase() + result.type.slice(1)} Test</h3>
                                        <span class="px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(result.status)}">
                                            ${result.status.charAt(0).toUpperCase() + result.status.slice(1)}
                                        </span>
                                    </div>
                                    <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400 mb-2">
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">person</span>
                                            <span>${result.orderedBy}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <span class="material-symbols-outlined text-sm">calendar_today</span>
                                            <span>${result.date}</span>
                                        </div>
                                    </div>
                                    <div class="flex flex-wrap gap-1 mb-2">
                                        ${result.tests.map(test => `
                                            <span class="px-2 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs rounded-full">
                                                ${test}
                                            </span>
                                        `).join('')}
                                    </div>
                                    ${result.results ? `
                                        <div class="text-sm text-slate-600 dark:text-slate-300">
                                            <span class="font-medium">Impression:</span> ${result.results.impression}
                                        </div>
                                    ` : `
                                        <div class="text-sm text-slate-500 dark:text-slate-400 italic">
                                            Results pending - typically available within 24-48 hours
                                        </div>
                                    `}
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${result.status === 'completed' ? `
                                    <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" onclick="event.stopPropagation(); downloadResult(${result.id})">
                                        <span class="material-symbols-outlined text-slate-500">download</span>
                                    </button>
                                ` : ''}
                                <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                    <span class="material-symbols-outlined text-slate-500">arrow_forward</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            function getTypeColor(type) {
                const colors = {
                    blood: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
                    imaging: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
                    urine: 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400',
                    pathology: 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400'
                };
                return colors[type] || 'bg-slate-100 text-slate-700';
            }
            
            function getTypeIcon(type) {
                const icons = {
                    blood: 'bloodtype',
                    imaging: 'image',
                    urine: 'water_drop',
                    pathology: 'biotech'
                };
                return icons[type] || 'science';
            }
            
            function getStatusColor(status) {
                const colors = {
                    completed: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400',
                    pending: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400',
                    review: 'bg-slate-100 text-slate-700 dark:bg-slate-900/30 dark:text-slate-400'
                };
                return colors[status] || 'bg-slate-100 text-slate-700';
            }
            
            // View result details
            window.viewResult = function(resultId) {
                const result = results.find(r => r.id === resultId);
                if (!result) return;
                
                const modal = document.getElementById('resultModal');
                const modalContent = document.getElementById('modalContent');
                
                modalContent.innerHTML = `
                    <div class="space-y-6">
                        <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${result.type.charAt(0).toUpperCase() + result.type.slice(1)} Test Results</h2>
                            <div class="flex items-center gap-4 mt-2 text-sm text-slate-500 dark:text-slate-400">
                                <span class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">person</span>
                                    ${result.orderedBy}
                                </span>
                                <span class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">calendar_today</span>
                                    ${result.date}
                                </span>
                            </div>
                        </div>
                        
                        ${result.status === 'completed' && result.detailedResults ? `
                            <div>
                                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Test Results</h3>
                                <div class="space-y-4">
                                    ${Object.entries(result.detailedResults).map(([testName, values]) => `
                                        <div class="bg-slate-50 dark:bg-slate-800 rounded-lg p-4">
                                            <h4 class="font-medium text-slate-900 dark:text-white mb-3">${testName}</h4>
                                            <div class="space-y-2">
                                                ${Object.entries(values).map(([parameter, result]) => `
                                                    <div class="flex justify-between items-center py-2 border-b border-slate-100 dark:border-slate-700 last:border-0">
                                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${parameter}</span>
                                                        <span class="text-sm font-medium text-slate-900 dark:text-white">${result}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div>
                                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Summary & Impression</h3>
                                <div class="bg-slate-50 dark:bg-slate-800 rounded-lg p-4">
                                    <div class="space-y-3">
                                        <div>
                                            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Impression:</span>
                                            <p class="text-sm text-slate-900 dark:text-white mt-1">${result.results.impression}</p>
                                        </div>
                                        ${result.results.findings ? `
                                            <div>
                                                <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Findings:</span>
                                                <p class="text-sm text-slate-900 dark:text-white mt-1">${result.results.findings}</p>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <div class="text-center py-8">
                                <span class="material-symbols-outlined text-6xl text-amber-500">schedule</span>
                                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mt-4">Results Pending</h3>
                                <p class="text-slate-500 dark:text-slate-400 mt-2">Your lab results are being processed and will be available within 24-48 hours.</p>
                                <div class="mt-6 bg-amber-50 dark:bg-amber-900/20 rounded-lg p-4">
                                    <p class="text-sm text-amber-700 dark:text-amber-400">
                                        <span class="font-medium">Tests ordered:</span> ${result.tests.join(', ')}
                                    </p>
                                </div>
                            </div>
                        `}
                        
                        <div class="flex gap-2">
                            ${result.status === 'completed' ? `
                                <button onclick="downloadResult(${result.id})" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                                    Download
                                </button>
                            ` : ''}
                            <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors">
                                Share
                            </button>
                        </div>
                    </div>
                `;
                
                modal.classList.remove('hidden');
            };
            
            // Download result
            window.downloadResult = function(resultId) {
                const result = results.find(r => r.id === resultId);
                if (!result) return;
                
                const content = `Lab Results - ${result.type.charAt(0).toUpperCase() + result.type.slice(1)} Test\nDate: ${result.date}\nOrdered by: ${result.orderedBy}\nStatus: ${result.status}\n\nTests: ${result.tests.join(', ')}\n\n${result.status === 'completed' && result.results ? `Impression: ${result.results.impression}\n${result.results.findings ? `Findings: ${result.results.findings}` : ''}` : 'Results pending - will be available within 24-48 hours'}`;
                
                const blob = new Blob([content], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lab-results-${result.id}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                alert('Lab results downloaded successfully');
            };
            
            // Close modal
            window.closeModal = function() {
                const modal = document.getElementById('resultModal');
                modal.classList.add('hidden');
            };
            
            // Filter functionality
            document.getElementById('searchInput').addEventListener('input', filterResults);
            document.getElementById('typeFilter').addEventListener('change', filterResults);
            document.getElementById('statusFilter').addEventListener('change', filterResults);
            
            function filterResults() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const typeFilter = document.getElementById('typeFilter').value;
                const statusFilter = document.getElementById('statusFilter').value;
                
                const filtered = results.filter(result => {
                    const matchesSearch = !searchTerm || 
                        result.type.toLowerCase().includes(searchTerm) ||
                        result.tests.some(test => test.toLowerCase().includes(searchTerm));
                    
                    const matchesType = !typeFilter || result.type === typeFilter;
                    const matchesStatus = !statusFilter || result.status === statusFilter;
                    
                    return matchesSearch && matchesType && matchesStatus;
                });
                
                // Re-render with filtered results
                const container = document.getElementById('resultsContainer');
                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <span class="material-symbols-outlined text-6xl text-slate-300 dark:text-slate-600">science</span>
                            <p class="text-slate-500 dark:text-slate-400 mt-4">No lab results found</p>
                        </div>
                    `;
                } else {
                    // Use the same render function but with filtered data
                    container.innerHTML = filtered.map(result => `
                        <div class="result-card bg-white dark:bg-card-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 hover:shadow-md transition-all cursor-pointer" onclick="viewResult(${result.id})">
                            <div class="flex items-start justify-between">
                                <div class="flex items-start gap-4">
                                    <div class="size-12 rounded-lg ${getTypeColor(result.type)} flex items-center justify-center shrink-0">
                                        <span class="material-symbols-outlined text-xl">${getTypeIcon(result.type)}</span>
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-2">
                                            <h3 class="text-lg font-semibold text-slate-900 dark:text-white">${result.type.charAt(0).toUpperCase() + result.type.slice(1)} Test</h3>
                                            <span class="px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(result.status)}">
                                                ${result.status.charAt(0).toUpperCase() + result.status.slice(1)}
                                            </span>
                                        </div>
                                        <div class="flex items-center gap-4 text-sm text-slate-500 dark:text-slate-400 mb-2">
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">person</span>
                                                <span>${result.orderedBy}</span>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <span class="material-symbols-outlined text-sm">calendar_today</span>
                                                <span>${result.date}</span>
                                            </div>
                                        </div>
                                        <div class="flex flex-wrap gap-1 mb-2">
                                            ${result.tests.map(test => `
                                                <span class="px-2 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs rounded-full">
                                                    ${test}
                                                </span>
                                            `).join('')}
                                        </div>
                                        ${result.results ? `
                                            <div class="text-sm text-slate-600 dark:text-slate-300">
                                                <span class="font-medium">Impression:</span> ${result.results.impression}
                                            </div>
                                        ` : `
                                            <div class="text-sm text-slate-500 dark:text-slate-400 italic">
                                                Results pending - typically available within 24-48 hours
                                            </div>
                                        `}
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    ${result.status === 'completed' ? `
                                        <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" onclick="event.stopPropagation(); downloadResult(${result.id})">
                                            <span class="material-symbols-outlined text-slate-500">download</span>
                                        </button>
                                    ` : ''}
                                    <button class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                        <span class="material-symbols-outlined text-slate-500">arrow_forward</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            }
            
            // Refresh functionality
            document.getElementById('refreshBtn').addEventListener('click', function() {
                this.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
                setTimeout(() => {
                    this.innerHTML = '<span class="material-symbols-outlined">refresh</span>';
                    alert('Lab results refreshed successfully');
                }, 1000);
            });
            
            // Initial render
            renderResults();
        });
    </script>
</body>
</html>
