<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MediLink Cloud - Authentication</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
                <span class="material-symbols-outlined text-white text-3xl">medical_services</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">MediLink Cloud</h1>
            <p class="text-gray-600 dark:text-gray-400">Healthcare Management System</p>
        </div>

        <!-- Auth Container -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
            <!-- Tab Headers -->
            <div class="flex border-b border-gray-200 dark:border-gray-700">
                <button onclick="switchTab('login')" id="loginTab" class="flex-1 py-4 text-center font-medium text-blue-600 border-b-2 border-blue-600 transition-colors">
                    Login
                </button>
                <button onclick="switchTab('register')" id="registerTab" class="flex-1 py-4 text-center font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginContent" class="tab-content active p-6">
                <form onsubmit="handleLogin(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                            <input type="email" id="loginEmail" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your email">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                            <input type="password" id="loginPassword" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your password">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Role</label>
                            <select id="loginRole" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                        Sign In
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerContent" class="tab-content p-6">
                <form onsubmit="handleRegister(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                            <input type="text" id="registerName" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your full name">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                            <input type="email" id="registerEmail" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your email">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                            <input type="password" id="registerPassword" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Create a password">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Role</label>
                            <select id="registerRole" onchange="handleRoleChange()" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        
                        <!-- Role-specific fields -->
                        <div id="doctorFields" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">License Number</label>
                                <input type="text" id="licenseNumber" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your license number">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Specialization</label>
                                <input type="text" id="specialization" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter your specialization">
                            </div>
                        </div>

                        <div id="adminFields" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Clinic Code</label>
                                <input type="text" id="clinicCode" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Enter clinic code">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                        Create Account
                    </button>
                </form>
            </div>
        </div>

        <!-- Message Display -->
        <div id="message" class="mt-4 p-4 rounded-lg text-center hidden"></div>
    </div>

    <script>
        // Tab switching
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginContent = document.getElementById('loginContent');
            const registerContent = document.getElementById('registerContent');

            if (tab === 'login') {
                loginTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                loginTab.classList.remove('text-gray-500', 'dark:text-gray-400');
                registerTab.classList.add('text-gray-500', 'dark:text-gray-400');
                registerTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                
                loginContent.classList.add('active');
                registerContent.classList.remove('active');
            } else {
                registerTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                registerTab.classList.remove('text-gray-500', 'dark:text-gray-400');
                loginTab.classList.add('text-gray-500', 'dark:text-gray-400');
                loginTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                
                registerContent.classList.add('active');
                loginContent.classList.remove('active');
            }
        }

        // Role change handler
        function handleRoleChange() {
            const role = document.getElementById('registerRole').value;
            const doctorFields = document.getElementById('doctorFields');
            const adminFields = document.getElementById('adminFields');

            doctorFields.classList.add('hidden');
            adminFields.classList.add('hidden');

            if (role === 'doctor') {
                doctorFields.classList.remove('hidden');
            } else if (role === 'admin') {
                adminFields.classList.remove('hidden');
            }
        }

        // Message display
        function showMessage(text, type = 'info') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.classList.remove('hidden');
            
            // Remove all color classes
            messageEl.classList.remove('bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700');
            
            // Add appropriate color classes
            if (type === 'success') {
                messageEl.classList.add('bg-green-100', 'text-green-700');
            } else if (type === 'error') {
                messageEl.classList.add('bg-red-100', 'text-red-700');
            } else {
                messageEl.classList.add('bg-blue-100', 'text-blue-700');
            }
            
            // Hide message after 5 seconds
            setTimeout(() => {
                messageEl.classList.add('hidden');
            }, 5000);
        }

        // Mock authentication functions
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            
            // Simple mock authentication
            if (email && password) {
                // Store authentication state
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', email.split('@')[0]);
                
                showMessage('Login successful! Redirecting...', 'success');
                
                // Redirect based on role
                setTimeout(() => {
                    if (role === 'admin') {
                        window.location.href = 'Admin/dashboard.html';
                    } else if (role === 'doctor') {
                        window.location.href = 'Doctor_Schedule/doctor_dashboard.html';
                    } else {
                        window.location.href = 'Patients/dashboard.html';
                    }
                }, 1500);
            } else {
                showMessage('Please fill in all fields', 'error');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;
            
            // Simple mock registration
            if (name && email && password) {
                // Store authentication state
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', name);
                
                showMessage('Registration successful! Redirecting...', 'success');
                
                // Redirect based on role
                setTimeout(() => {
                    if (role === 'admin') {
                        window.location.href = 'Admin/dashboard.html';
                    } else if (role === 'doctor') {
                        window.location.href = 'Doctor_Schedule/doctor_dashboard.html';
                    } else {
                        window.location.href = 'Patients/dashboard.html';
                    }
                }, 1500);
            } else {
                showMessage('Please fill in all required fields', 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already authenticated
            if (localStorage.getItem('isAuthenticated') === 'true') {
                const role = localStorage.getItem('userRole');
                if (role === 'admin') {
                    window.location.href = 'Admin/dashboard.html';
                } else if (role === 'doctor') {
                    window.location.href = 'Doctor_Schedule/doctor_dashboard.html';
                } else {
                    window.location.href = 'Patients/dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
